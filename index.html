<!-- AutoSurfZone MVP - Single File -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoSurfZone</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    header, footer { background: #222; color: #fff; text-align: center; padding: 15px; }
    nav a { color: #fff; margin: 0 10px; text-decoration: none; }
    main { padding: 20px; }
    section { margin-bottom: 30px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; }
    button, input[type="text"], form button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
    button { background: #007bff; color: #fff; }
    form button { background: #28a745; color: #fff; }
    iframe { width: 100%; height: 300px; border: 1px solid #ccc; border-radius: 5px; }
    #timer { font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>AutoSurfZone</h1>
    <nav>
      <a href="#dashboard">Dashboard</a>
      <a href="#surf">Autosurf</a>
      <a href="#withdraw">Withdraw</a>
    </nav>
  </header>

  <main>
    <section id="dashboard">
      <h2>Dashboard</h2>
      <p>Balance: <span id="balance">0.00000000 LTC</span></p>
      <button onclick="startSurfing()">Start Surfing</button>
    </section>

    <section id="surf" style="display:none;">
      <h2>Autosurf</h2>
      <iframe id="adFrame" src="" allowfullscreen></iframe>
      <p>Next site in: <span id="timer">30</span> sec</p>
    </section>

    <section id="withdraw">
      <h2>Withdraw</h2>
      <form id="withdrawForm" onsubmit="handleWithdraw(event)">
        <input type="text" id="wallet" placeholder="Your LTC Wallet Address" required />
        <button type="submit">Withdraw</button>
      </form>
      <p id="withdrawMsg"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 AutoSurfZone. All rights reserved.</p>
  </footer>

  <script>
    const adLinks = [
      "https://www.binance.com/en/activity/referral-entry?ref=DEMO_CODE",
      "https://faucetpay.io/?r=DEMO_USER",
      "https://zeydoo.com/demo_offer1",
      "https://zeydoo.com/demo_offer2"
    ];

    let currentIndex = 0;
    let balance = 0.00000000;
    let surfInterval;

    function updateBalance() {
      balance += 0.00000001;
      document.getElementById("balance").textContent = balance.toFixed(8) + " LTC";
    }

    function loadNextAd() {
      document.getElementById("adFrame").src = adLinks[currentIndex];
      currentIndex = (currentIndex + 1) % adLinks.length;
    }

    function startSurfing() {
      document.getElementById("surf").style.display = "block";
      loadNextAd();
      let countdown = 30;
      document.getElementById("timer").textContent = countdown;
      surfInterval = setInterval(() => {
        countdown--;
        document.getElementById("timer").textContent = countdown;
        if (countdown <= 0) {
          updateBalance();
          loadNextAd();
          countdown = 30;
        }
      }, 1000);
    }

    function handleWithdraw(event) {
      event.preventDefault();
      const msg = document.getElementById("withdrawMsg");
      msg.textContent = "Withdrawal feature is demo only. Connect FaucetPay API for real payouts.";
      msg.style.color = "#dc3545";
    }
  </script>
</body>
</html>
