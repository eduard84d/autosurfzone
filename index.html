
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoSurfZone</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    iframe { width: 90%; height: 400px; border: none; margin-top: 20px; }
    button { padding: 10px 20px; font-size: 16px; margin: 10px; }
  </style>
</head>
<body>
  <h1>AutoSurfZone</h1>
  <p>Просматривайте рекламу и зарабатывайте LTC</p>
  <div>
    <p><strong>Ваш баланс:</strong> <span id="balance">0</span> LTC</p>
    <p><strong>Просмотров сегодня:</strong> <span id="viewsCount">0</span></p>
    <button id="withdrawBtn">Вывести средства</button>
    <p id="withdrawMsg"></p>
  </div>
  <iframe id="adFrame" src=""></iframe>

  <script>
    const adLinks = [
      'https://antautosurf.com/?ref=29085',
      'https://faucetpay.io/?r=2738792',
      'https://socpublic.com/?i=9480820&slide=1',
      'https://bitsbon.com/?ref=5148',
      'https://payeer.com/?session=12482302',
      'https://rollercoin.com/?r=kndi047d',
      'https://viefaucet.com?r=61e83d735cc8356fa4bded97',
      'https://www.coinpayu.com/?r=eduard85',
      'https://www.binance.com/referral/earn-together/refertoearn2000usdc/claim?hl=ru&ref=GRO_14352_KKBV3&utm_medium=web_share_copy&utm_source=referralmode',
      'https://freebitco.in/?r=36730895'
    ];

    let balance = parseFloat(localStorage.getItem('balance')) || 0;
    let viewsCount = parseInt(localStorage.getItem('viewsCount')) || 0;
    const earnPerView = 0.00000050;
    const maxViewsPerDay = 10;
    const minWithdraw = 0.0001;

    const balanceEl = document.getElementById('balance');
    const viewsEl = document.getElementById('viewsCount');
    const withdrawBtn = document.getElementById('withdrawBtn');
    const withdrawMsg = document.getElementById('withdrawMsg');

    function updateUI() {
      balanceEl.textContent = balance.toFixed(8);
      viewsEl.textContent = viewsCount;
    }

    function updateBalance() {
      balance += earnPerView;
      localStorage.setItem('balance', balance.toString());
      updateUI();
    }

    function showNextAd() {
      if (document.visibilityState !== 'visible') return;
      if (viewsCount >= maxViewsPerDay) return;

      const idx = Math.floor(Math.random() * adLinks.length);
      document.getElementById('adFrame').src = adLinks[idx];

      viewsCount++;
      localStorage.setItem('viewsCount', viewsCount.toString());
      updateBalance();

      setTimeout(showNextAd, 20000);
    }

    withdrawBtn.addEventListener('click', () => {
      const wallet = localStorage.getItem('wallet') || 'anonymous';
      if (balance < minWithdraw) {
        withdrawMsg.textContent = 'Минимальная сумма для вывода — 0.0001 LTC';
        withdrawMsg.style.color = 'red';
        return;
      }
      withdrawMsg.textContent = 'Запрос на вывод отправлен (симуляция).';
      withdrawMsg.style.color = 'green';
      balance = 0;
      localStorage.setItem('balance', '0');
      updateUI();
    });

    function startSurfing() {
      let wallet = localStorage.getItem('wallet');
      if (!wallet) {
        wallet = prompt('Введите ваш LTC-кошелёк:');
        localStorage.setItem('wallet', wallet);
      }
      updateUI();
      showNextAd();
    }

    window.addEventListener('load', startSurfing);
  </script>
</body>
</html>
